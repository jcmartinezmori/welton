<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Operational Scenarios under a Completed D Line</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f7fb;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0;
      color: #6b7280;
    }

    .controls {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin: 20px 0;
      padding: 16px 20px;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
    }

    .control-label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #dbe2ea;
      background: white;
      color: #1f2937;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:hover {
      background: #f1f5f9;
    }

    button.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
      font-weight: bold;
    }

    .reports {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .report {
      width: 100%;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      overflow: hidden;
    }

    .report-title {
      margin: 0;
      padding: 10px 16px;
      font-size: 1.1rem;
      background: #fafafa;
      border-bottom: 1px solid #dbe2ea;
    }

    .iframe-shell {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: white;
    }

    .iframe-shell iframe {
      display: block;
      border: 0;
      transform-origin: top left;
    }

    @media (max-width: 900px) {
      .page {
        padding: 10px;
      }

      .controls {
        gap: 15px;
      }
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <h1>Operational Scenarios under a Completed D Line</h1>
    </header>

    <div class="controls">

      <div>
        <span class="control-label">Line</span>

        <div class="button-row" id="lineButtons">

          <button
            type="button"
            class="active"
            data-line="D"
          >
            Holiday Train (Original D Line)
          </button>

          <button
            type="button"
            data-line="L"
          >
            L Line (Truncated D Line)
          </button>

        </div>
      </div>


      <div>
        <span class="control-label">Track assumption</span>

        <div class="button-row" id="improvementButtons">

          <button
            type="button"
            class="active"
            data-improvement="1"
          >
            No Further Track Improvement
          </button>

          <button
            type="button"
            data-improvement="0.7"
          >
            Reduction of In-Vehicle Travel Time
          </button>

        </div>
      </div>

    </div>


    <div class="reports">

      <div class="report">

        <h2 class="report-title" id="weltonTitle">
          Access to Five Points
        </h2>

        <div class="iframe-shell" id="weltonShell">

          <iframe
            id="weltonFrame"
            scrolling="no"
            title="Access to Five Points report"
          ></iframe>

        </div>

      </div>


      <div class="report">

        <h2 class="report-title" id="diaTitle">
          Access to DIA
        </h2>

        <div class="iframe-shell" id="diaShell">

          <iframe
            id="diaFrame"
            scrolling="no"
            title="Access to DIA report"
          ></iframe>

        </div>

      </div>

    </div>

  </div>


  <script>

    /*
     * ============================================================
     * REPORT FILES
     * ============================================================
     */

    const REPORTS = {

      D: {

        "1": {
          welton:
            "output/figures/gtfs_2025-08-31_2026-01-03/welton/trip_durations_kappa_1.html",

          dia:
            "output/figures/gtfs_2025-08-31_2026-01-03/dia/trip_durations_kappa_1.html"
        },

        "0.7": {
          welton:
            "output/figures/gtfs_2025-08-31_2026-01-03/welton/trip_durations_kappa_0.7.html",

          dia:
            "output/figures/gtfs_2025-08-31_2026-01-03/dia/trip_durations_kappa_0.7.html"
        }

      },


      L: {

        "1": {
          welton:
            "output/figures/gtfs_2026-01-04_2026-06-06/welton/trip_durations_kappa_1.html",

          dia:
            "output/figures/gtfs_2026-01-04_2026-06-06/dia/trip_durations_kappa_1.html"
        },

        "0.7": {
          welton:
            "output/figures/gtfs_2026-01-04_2026-06-06/welton/trip_durations_kappa_0.7.html",

          dia:
            "output/figures/gtfs_2026-01-04_2026-06-06/dia/trip_durations_kappa_0.7.html"
        }

      }

    };


    /*
     * ============================================================
     * STATE
     * ============================================================
     */

    const state = {
      line: "D",
      improvement: "1"
    };


    /*
     * ============================================================
     * ELEMENTS
     * ============================================================
     */

    const lineButtons =
      document.querySelectorAll("#lineButtons button");

    const improvementButtons =
      document.querySelectorAll("#improvementButtons button");

    const weltonFrame =
      document.getElementById("weltonFrame");

    const diaFrame =
      document.getElementById("diaFrame");

    const weltonShell =
      document.getElementById("weltonShell");

    const diaShell =
      document.getElementById("diaShell");

    const weltonTitle =
      document.getElementById("weltonTitle");

    const diaTitle =
      document.getElementById("diaTitle");


    /*
     * ============================================================
     * IFRAME FITTING
     * ============================================================
     */

    function fitIframe(iframe, shell) {

      try {

        const doc =
          iframe.contentWindow.document;

        if (!doc) {
          return;
        }

        const html =
          doc.documentElement;

        const body =
          doc.body;

        if (!html || !body) {
          return;
        }

        const contentWidth =
          Math.max(
            body.scrollWidth,
            body.offsetWidth,
            html.scrollWidth,
            html.offsetWidth
          );

        const contentHeight =
          Math.max(
            body.scrollHeight,
            body.offsetHeight,
            html.scrollHeight,
            html.offsetHeight
          );

        if (!contentWidth || !contentHeight) {
          return;
        }

        const shellWidth =
          shell.clientWidth || window.innerWidth;

        const scale =
          Math.min(
            1,
            shellWidth / contentWidth
          );

        iframe.style.width =
          contentWidth + "px";

        iframe.style.height =
          contentHeight + "px";

        iframe.style.transform =
          `scale(${scale})`;

        shell.style.height =
          (contentHeight * scale) + "px";

      } catch (error) {

        console.warn(
          "Could not fit iframe:",
          error
        );

      }

    }


    /*
     * ============================================================
     * FIND THE PLOTLY GRAPH
     * ============================================================
     */

    function getPlotlyGraph(iframe) {

      try {

        const doc =
          iframe.contentWindow.document;

        if (!doc) {
          return null;
        }

        return (
          doc.querySelector(".js-plotly-plot") ||
          doc.querySelector(".plotly-graph-div")
        );

      } catch (error) {

        console.warn(
          "Could not access Plotly graph:",
          error
        );

        return null;
      }

    }


    /*
     * ============================================================
     * SYNCHRONIZATION STATE
     * ============================================================
     *
     * This prevents the change we send to the second graph from
     * immediately triggering another change back to the first.
     */

    let isSynchronizing = false;


    /*
     * ============================================================
     * COPY PLOTLY RELAYOUT
     * ============================================================
     */

    function copyRelayout(
      sourceFrame,
      targetFrame,
      eventData
    ) {

      if (isSynchronizing) {
        return;
      }

      if (!eventData) {
        return;
      }

      const sourceGraph =
        getPlotlyGraph(sourceFrame);

      const targetGraph =
        getPlotlyGraph(targetFrame);

      if (!sourceGraph || !targetGraph) {
        return;
      }

      const targetPlotly =
        targetFrame.contentWindow.Plotly;

      if (!targetPlotly) {
        return;
      }


      /*
       * ----------------------------------------------------------
       * IMPORTANT:
       *
       * Plotly can report a drag as:
       *
       * shapes[0].x0
       * shapes[0].x1
       * shapes[1].x0
       * ...
       *
       * or as xaxis range changes.
       *
       * We copy the complete relayout event, so the same
       * interactive movement gets applied to the second chart.
       * ----------------------------------------------------------
       */

      isSynchronizing = true;

      try {

        targetPlotly.relayout(
          targetGraph,
          eventData
        );

      } catch (error) {

        console.warn(
          "Plotly relayout synchronization failed:",
          error
        );

      }

      setTimeout(() => {
        isSynchronizing = false;
      }, 100);

    }


    /*
     * ============================================================
     * COPY PLOTLY RESTYLE
     * ============================================================
     *
     * Some interactive Plotly controls use restyle rather than
     * relayout.
     */

    function copyRestyle(
      sourceFrame,
      targetFrame,
      data,
      indices
    ) {

      if (isSynchronizing) {
        return;
      }

      if (!data) {
        return;
      }

      const targetGraph =
        getPlotlyGraph(targetFrame);

      if (!targetGraph) {
        return;
      }

      const targetPlotly =
        targetFrame.contentWindow.Plotly;

      if (!targetPlotly) {
        return;
      }

      isSynchronizing = true;

      try {

        targetPlotly.restyle(
          targetGraph,
          data,
          indices
        );

      } catch (error) {

        console.warn(
          "Plotly restyle synchronization failed:",
          error
        );

      }

      setTimeout(() => {
        isSynchronizing = false;
      }, 100);

    }


    /*
     * ============================================================
     * ATTACH PLOTLY EVENT LISTENERS
     * ============================================================
     */

    function attachPlotlySynchronization(
      sourceFrame,
      targetFrame
    ) {

      const graph =
        getPlotlyGraph(sourceFrame);

      if (!graph) {
        return false;
      }

      /*
       * Avoid attaching listeners multiple times.
       */

      if (graph.__deltaSyncAttached) {
        return true;
      }

      graph.__deltaSyncAttached = true;


      /*
       * Dragging shapes / delta markers / axes.
       */

      if (
        typeof graph.on === "function"
      ) {

        graph.on(
          "plotly_relayout",
          function(eventData) {

            copyRelayout(
              sourceFrame,
              targetFrame,
              eventData
            );

          }
        );


        /*
         * Controls that modify trace properties.
         */

        graph.on(
          "plotly_restyle",
          function(data, indices) {

            copyRestyle(
              sourceFrame,
              targetFrame,
              data,
              indices
            );

          }
        );


        /*
         * A generic update event can occur for some Plotly
         * controls. We don't copy it blindly because its payload
         * can differ between Plotly versions.
         */
        graph.on(
          "plotly_update",
          function() {

            /*
             * Usually the actual change has already generated
             * relayout/restyle above.
             */
          }
        );

      }

      return true;
    }


    /*
     * ============================================================
     * WAIT UNTIL PLOTLY EXISTS
     * ============================================================
     *
     * Plotly HTML files often load Plotly asynchronously.
     * Therefore attaching the listener immediately on iframe
     * load isn't reliable.
     */

    function waitForPlotly(
      sourceFrame,
      targetFrame,
      attemptsLeft = 50
    ) {

      if (attemptsLeft <= 0) {

        console.warn(
          "Could not find Plotly graph for synchronization."
        );

        return;
      }

      try {

        const graph =
          getPlotlyGraph(sourceFrame);

        const plotly =
          sourceFrame.contentWindow.Plotly;

        if (
          graph &&
          plotly &&
          typeof graph.on === "function"
        ) {

          attachPlotlySynchronization(
            sourceFrame,
            targetFrame
          );

          return;
        }

      } catch (error) {
        // Continue polling.
      }

      setTimeout(
        () => {

          waitForPlotly(
            sourceFrame,
            targetFrame,
            attemptsLeft - 1
          );

        },
        100
      );

    }


    /*
     * ============================================================
     * IFRAME LOAD SETUP
     * ============================================================
     */

    function setupIframe(
      iframe,
      shell,
      otherFrame
    ) {

      iframe.addEventListener(
        "load",
        () => {

          /*
           * Fit the figure.
           */

          fitIframe(
            iframe,
            shell
          );

          setTimeout(() => {
            fitIframe(
              iframe,
              shell
            );
          }, 100);

          setTimeout(() => {
            fitIframe(
              iframe,
              shell
            );
          }, 500);

          setTimeout(() => {
            fitIframe(
              iframe,
              shell
            );
          }, 1000);


          /*
           * Most important part:
           *
           * Wait until the embedded Plotly graph exists,
           * then connect its interactive events to the other
           * figure.
           */

          waitForPlotly(
            iframe,
            otherFrame
          );


          /*
           * Keep the iframe height synchronized with its
           * internal document.
           */

          try {

            const doc =
              iframe.contentWindow.document;

            if (
              doc.body &&
              doc.documentElement &&
              typeof ResizeObserver !== "undefined"
            ) {

              const observer =
                new ResizeObserver(() => {

                  fitIframe(
                    iframe,
                    shell
                  );

                });

              observer.observe(
                doc.body
              );

              observer.observe(
                doc.documentElement
              );
            }

          } catch (error) {

            console.warn(
              "Could not attach iframe ResizeObserver:",
              error
            );

          }

        }
      );

    }


    /*
     * ============================================================
     * LOAD / CHANGE SCENARIO
     * ============================================================
     */

    function updateUI() {

      const selected =
        REPORTS[
          state.line
        ][
          state.improvement
        ];


      /*
       * Both figures are always changed together when the
       * scenario buttons are changed.
       */

      weltonFrame.src =
        selected.welton;

      diaFrame.src =
        selected.dia;


      /*
       * Titles.
       */

      weltonTitle.textContent =
        "Access to Five Points";

      diaTitle.textContent =
        "Access to DIA";


      /*
       * Buttons.
       */

      lineButtons.forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.line === state.line
        );

      });

      improvementButtons.forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.improvement ===
          state.improvement
        );

      });

    }


    /*
     * ============================================================
     * SCENARIO BUTTONS
     * ============================================================
     */

    lineButtons.forEach(button => {

      button.addEventListener(
        "click",
        () => {

          state.line =
            button.dataset.line;

          updateUI();

        }
      );

    });


    improvementButtons.forEach(button => {

      button.addEventListener(
        "click",
        () => {

          state.improvement =
            button.dataset.improvement;

          updateUI();

        }
      );

    });


    /*
     * ============================================================
     * SET UP IFRAME LISTENERS
     * ============================================================
     */

    setupIframe(
      weltonFrame,
      weltonShell,
      diaFrame
    );

    setupIframe(
      diaFrame,
      diaShell,
      weltonFrame
    );


    /*
     * ============================================================
     * WINDOW RESIZE
     * ============================================================
     */

    window.addEventListener(
      "resize",
      () => {

        fitIframe(
          weltonFrame,
          weltonShell
        );

        fitIframe(
          diaFrame,
          diaShell
        );

      }
    );


    /*
     * ============================================================
     * INITIAL LOAD
     * ============================================================
     */

    updateUI();

  </script>

</body>
</html>
