<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Operational Scenarios under a Completed D Line</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f7fb;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
    }

    .controls {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin: 20px 0;
      padding: 16px 20px;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
    }

    .control-label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #dbe2ea;
      background: white;
      color: #1f2937;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:hover {
      background: #f1f5f9;
    }

    button.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
      font-weight: bold;
    }

    .reports {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .report {
      width: 100%;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      overflow: hidden;
    }

    .report-title {
      margin: 0;
      padding: 10px 16px;
      font-size: 1.1rem;
      background: #fafafa;
      border-bottom: 1px solid #dbe2ea;
    }

    .iframe-shell {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: white;
    }

    .iframe-shell iframe {
      display: block;
      border: 0;
      transform-origin: top left;
    }

    @media (max-width: 900px) {
      .page {
        padding: 10px;
      }

      .controls {
        gap: 15px;
      }
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <h1>Operational Scenarios under a Completed D Line</h1>
    </header>

    <div class="controls">

      <div>
        <span class="control-label">Line</span>

        <div class="button-row" id="lineButtons">

          <button
            type="button"
            class="active"
            data-line="D"
          >
            Holiday Train (Original D Line)
          </button>

          <button
            type="button"
            data-line="L"
          >
            L Line (Truncated D Line)
          </button>

        </div>
      </div>


      <div>
        <span class="control-label">Track Assumption</span>

        <div class="button-row" id="improvementButtons">

          <button
            type="button"
            class="active"
            data-improvement="1"
          >
            With No Further Track Improvements
          </button>

          <button
            type="button"
            data-improvement="0.7"
          >
            With 30% Reduction of In-Vehicle Travel Times
          </button>

        </div>
      </div>

    </div>


    <div class="reports">

      <div class="report">

        <h2 class="report-title">
          Access to Five Points
        </h2>

        <div class="iframe-shell" id="weltonShell">

          <iframe
            id="weltonFrame"
            scrolling="no"
            title="Access to Five Points report"
          ></iframe>

        </div>

      </div>


      <div class="report">

        <h2 class="report-title">
          Access to DIA
        </h2>

        <div class="iframe-shell" id="diaShell">

          <iframe
            id="diaFrame"
            scrolling="no"
            title="Access to DIA report"
          ></iframe>

        </div>

      </div>

    </div>

  </div>


  <script>

    /*
     * ============================================================
     * ORIGINAL REPORT FILES
     * ============================================================
     */

    const REPORTS = {

      D: {

        "1": {
          welton:
            "output/figures/gtfs_2025-08-31_2026-01-03/welton/trip_durations_kappa_1.html",

          dia:
            "output/figures/gtfs_2025-08-31_2026-01-03/dia/trip_durations_kappa_1.html"
        },

        "0.7": {
          welton:
            "output/figures/gtfs_2025-08-31_2026-01-03/welton/trip_durations_kappa_0.7.html",

          dia:
            "output/figures/gtfs_2025-08-31_2026-01-03/dia/trip_durations_kappa_0.7.html"
        }

      },


      L: {

        "1": {
          welton:
            "output/figures/gtfs_2026-01-04_2026-06-06/welton/trip_durations_kappa_1.html",

          dia:
            "output/figures/gtfs_2026-01-04_2026-06-06/dia/trip_durations_kappa_1.html"
        },

        "0.7": {
          welton:
            "output/figures/gtfs_2026-01-04_2026-06-06/welton/trip_durations_kappa_0.7.html",

          dia:
            "output/figures/gtfs_2026-01-04_2026-06-06/dia/trip_durations_kappa_0.7.html"
        }

      }

    };


    /*
     * ============================================================
     * STATE
     * ============================================================
     */

    const state = {
      line: "D",
      improvement: "1",
      delta: "0.0"
    };


    /*
     * ============================================================
     * DOM ELEMENTS
     * ============================================================
     */

    const lineButtons =
      document.querySelectorAll("#lineButtons button");

    const improvementButtons =
      document.querySelectorAll("#improvementButtons button");

    const weltonFrame =
      document.getElementById("weltonFrame");

    const diaFrame =
      document.getElementById("diaFrame");

    const weltonShell =
      document.getElementById("weltonShell");

    const diaShell =
      document.getElementById("diaShell");


    /*
     * ============================================================
     * IFRAME SIZING
     * ============================================================
     */

    function fitIframe(iframe, shell) {

      try {

        const doc =
          iframe.contentWindow.document;

        if (!doc) {
          return;
        }

        const html =
          doc.documentElement;

        const body =
          doc.body;

        if (!html || !body) {
          return;
        }

        const contentWidth =
          Math.max(
            body.scrollWidth,
            body.offsetWidth,
            html.scrollWidth,
            html.offsetWidth
          );

        const contentHeight =
          Math.max(
            body.scrollHeight,
            body.offsetHeight,
            html.scrollHeight,
            html.offsetHeight
          );

        if (!contentWidth || !contentHeight) {
          return;
        }

        const shellWidth =
          shell.clientWidth || window.innerWidth;

        const scale =
          Math.min(
            1,
            shellWidth / contentWidth
          );

        iframe.style.width =
          contentWidth + "px";

        iframe.style.height =
          contentHeight + "px";

        iframe.style.transform =
          `scale(${scale})`;

        shell.style.height =
          (contentHeight * scale) + "px";

      } catch (error) {

        console.warn(
          "Could not fit iframe:",
          error
        );

      }

    }


    /*
     * ============================================================
     * GET THE PLOTLY GRAPH
     * ============================================================
     */

    function getPlotlyGraph(iframe) {

      try {

        const doc =
          iframe.contentWindow.document;

        if (!doc) {
          return null;
        }

        return (
          doc.querySelector(".plotly-graph-div") ||
          doc.querySelector(".js-plotly-plot")
        );

      } catch (error) {

        return null;

      }

    }


    /*
     * ============================================================
     * GET THE OTHER GRAPH
     * ============================================================
     */

    function getOtherFrame(frame) {

      if (frame === weltonFrame) {
        return diaFrame;
      }

      return weltonFrame;
    }


    /*
     * ============================================================
     * DELTA SYNCHRONIZATION
     * ============================================================
     *
     * Your actual report uses:
     *
     *   layout.sliders[0]
     *
     * with steps labelled:
     *
     *   0.0
     *   1.0
     *   2.0
     *   ...
     *   14.0
     *
     * and each step uses:
     *
     *   method: "update"
     *
     * to change trace visibility.
     *
     * We therefore synchronize the STEP, not a shape or axis.
     */

    let syncingDelta = false;


    function getSlider(graph) {

      if (
        !graph ||
        !graph.layout ||
        !graph.layout.sliders ||
        !graph.layout.sliders.length
      ) {
        return null;
      }

      return graph.layout.sliders[0];

    }


    function findDeltaStep(graph, deltaLabel) {

      const slider =
        getSlider(graph);

      if (!slider || !slider.steps) {
        return -1;
      }

      return slider.steps.findIndex(
        step =>
          String(step.label) ===
          String(deltaLabel)
      );

    }


    function applyDeltaToFrame(frame, deltaLabel) {

      const graph =
        getPlotlyGraph(frame);

      if (!graph) {
        return;
      }

      const plotly =
        frame.contentWindow.Plotly;

      if (!plotly) {
        return;
      }

      const slider =
        getSlider(graph);

      if (!slider) {
        return;
      }

      const targetIndex =
        findDeltaStep(
          graph,
          deltaLabel
        );

      if (targetIndex < 0) {
        console.warn(
          "Could not find delta step:",
          deltaLabel
        );
        return;
      }

      const targetStep =
        slider.steps[targetIndex];


      /*
       * Execute the SAME Plotly update that the target
       * figure would execute if its own slider were moved.
       *
       * This is much more reliable than copying the
       * source figure's visibility array because the two
       * reports may have different underlying data.
       */

      try {

        if (
          targetStep.method === "update" &&
          Array.isArray(targetStep.args)
        ) {

          const dataUpdate =
            targetStep.args[0] || {};

          const layoutUpdate =
            targetStep.args[1] || {};

          plotly.update(
            graph,
            dataUpdate,
            layoutUpdate
          );

        }

        /*
         * Move the actual slider handle in the target
         * figure so the displayed delta also changes.
         */

        plotly.relayout(
          graph,
          {
            "sliders[0].active":
              targetIndex
          }
        );

      } catch (error) {

        console.error(
          "Could not apply synchronized delta:",
          error
        );

      }

    }


    function synchronizeDelta(
      sourceFrame,
      deltaLabel
    ) {

      if (syncingDelta) {
        return;
      }

      const targetFrame =
        getOtherFrame(sourceFrame);

      if (!targetFrame) {
        return;
      }

      /*
       * Both reports use the same δ values, so use the
       * label itself as the synchronization key.
       *
       * This means δ = 7.0 in one figure selects δ = 7.0
       * in the other figure.
       */

      state.delta =
        String(deltaLabel);

      syncingDelta = true;

      try {

        applyDeltaToFrame(
          targetFrame,
          state.delta
        );

      } finally {

        /*
         * Do not release the lock immediately. The target
         * Plotly update can itself emit slider events.
         */

        setTimeout(() => {
          syncingDelta = false;
        }, 150);

      }

    }


    /*
     * ============================================================
     * ATTACH SLIDER EVENT
     * ============================================================
     */

    function attachDeltaListener(
      frame
    ) {

      const graph =
        getPlotlyGraph(frame);

      if (!graph) {
        return false;
      }

      if (graph.__sharedDeltaListener) {
        return true;
      }

      graph.__sharedDeltaListener = true;


      /*
       * THIS is the important Plotly event.
       *
       * Your report's delta is a Plotly slider, and Plotly
       * exposes its change through plotly_sliderchange.
       */

      graph.on(
        "plotly_sliderchange",
        function(eventData) {

          if (syncingDelta) {
            return;
          }

          if (
            !eventData ||
            !eventData.step
          ) {
            return;
          }

          const deltaLabel =
            eventData.step.label;

          synchronizeDelta(
            frame,
            deltaLabel
          );

        }
      );


      return true;

    }


    /*
     * ============================================================
     * WAIT FOR PLOTLY
     * ============================================================
     */

    function waitForPlotly(
      frame,
      attempts = 100
    ) {

      if (attempts <= 0) {

        console.warn(
          "Could not attach delta synchronization to iframe."
        );

        return;

      }

      const graph =
        getPlotlyGraph(frame);

      const plotly =
        frame.contentWindow.Plotly;

      if (
        graph &&
        plotly &&
        typeof graph.on === "function"
      ) {

        attachDeltaListener(frame);

        /*
         * Keep the iframe fitted after Plotly has finished
         * rendering.
         */

        return;

      }

      setTimeout(
        () => {

          waitForPlotly(
            frame,
            attempts - 1
          );

        },
        100
      );

    }


    /*
     * ============================================================
     * IFRAME LOAD EVENTS
     * ============================================================
     */

    function setupIframe(
      frame,
      shell
    ) {

      frame.addEventListener(
        "load",
        () => {

          fitIframe(
            frame,
            shell
          );

          setTimeout(
            () => fitIframe(
              frame,
              shell
            ),
            100
          );

          setTimeout(
            () => fitIframe(
              frame,
              shell
            ),
            500
          );

          setTimeout(
            () => fitIframe(
              frame,
              shell
            ),
            1000
          );

          /*
           * Wait until the embedded Plotly graph exists.
           */

          waitForPlotly(frame);

        }
      );

    }


    /*
     * ============================================================
     * LOAD REPORTS
     * ============================================================
     */

    function updateReports() {

      const selected =
        REPORTS[
          state.line
        ][
          state.improvement
        ];


      /*
       * Load the original report HTML files.
       */

      weltonFrame.src =
        selected.welton;

      diaFrame.src =
        selected.dia;

    }


    /*
     * ============================================================
     * BUTTONS
     * ============================================================
     */

    function updateButtonStates() {

      lineButtons.forEach(
        button => {

          button.classList.toggle(
            "active",
            button.dataset.line ===
            state.line
          );

        }
      );


      improvementButtons.forEach(
        button => {

          button.classList.toggle(
            "active",
            button.dataset.improvement ===
            state.improvement
          );

        }
      );

    }


    lineButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            state.line =
              button.dataset.line;

            updateButtonStates();
            updateReports();

          }
        );

      }
    );


    improvementButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            state.improvement =
              button.dataset.improvement;

            updateButtonStates();
            updateReports();

          }
        );

      }
    );


    /*
     * ============================================================
     * RESIZE
     * ============================================================
     */

    window.addEventListener(
      "resize",
      () => {

        fitIframe(
          weltonFrame,
          weltonShell
        );

        fitIframe(
          diaFrame,
          diaShell
        );

      }
    );


    /*
     * ============================================================
     * START
     * ============================================================
     */

    setupIframe(
      weltonFrame,
      weltonShell
    );

    setupIframe(
      diaFrame,
      diaShell
    );

    updateButtonStates();

    updateReports();

  </script>

</body>
</html>
