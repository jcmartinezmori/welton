<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completed Line Reports</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f7fb;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0;
      color: #6b7280;
    }

    .controls {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin: 20px 0;
      padding: 16px 20px;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
    }

    .control-label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #dbe2ea;
      background: white;
      color: #1f2937;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:hover {
      background: #f1f5f9;
    }

    button.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
      font-weight: bold;
    }

    .reports {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .report {
      width: 100%;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      overflow: hidden;
    }

    .report-title {
      margin: 0;
      padding: 10px 16px;
      font-size: 1.1rem;
      background: #fafafa;
      border-bottom: 1px solid #dbe2ea;
    }

    iframe {
      display: block;
      width: 100%;
      border: 0;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .page {
        padding: 10px;
      }

      .controls {
        gap: 15px;
      }
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <h1>Completed D and L Line Reports</h1>
      <p class="subtitle">
        Select the line and track assumption. Welton is shown first, followed by DIA.
      </p>
    </header>

    <div class="controls">
      <div>
        <span class="control-label">Line</span>
        <div class="button-row" id="lineButtons">
          <button type="button" class="active" data-line="D">D Line</button>
          <button type="button" data-line="L">L Line</button>
        </div>
      </div>

      <div>
        <span class="control-label">Track assumption</span>
        <div class="button-row" id="improvementButtons">
          <button type="button" class="active" data-improvement="1">No Track Improvement</button>
          <button type="button" data-improvement="0.7">With Track Improvement</button>
        </div>
      </div>
    </div>

    <div class="reports">
      <div class="report">
        <h2 class="report-title" id="weltonTitle">Welton</h2>
        <iframe id="weltonFrame" scrolling="no" title="Welton report"></iframe>
      </div>

      <div class="report">
        <h2 class="report-title" id="diaTitle">DIA</h2>
        <iframe id="diaFrame" scrolling="no" title="DIA report"></iframe>
      </div>
    </div>
  </div>

  <script>
    const REPORTS = {
      D: {
        "1": {
          welton: "output/figures/gtfs_2025-08-31_2026-01-03/welton/trip_durations_kappa_1.html",
          dia: "output/figures/gtfs_2025-08-31_2026-01-03/dia/trip_durations_kappa_1.html"
        },
        "0.7": {
          welton: "output/figures/gtfs_2025-08-31_2026-01-03/welton/trip_durations_kappa_0.7.html",
          dia: "output/figures/gtfs_2025-08-31_2026-01-03/dia/trip_durations_kappa_0.7.html"
        }
      },
      L: {
        "1": {
          welton: "output/figures/gtfs_2026-01-04_2026-06-06/welton/trip_durations_kappa_1.html",
          dia: "output/figures/gtfs_2026-01-04_2026-06-06/dia/trip_durations_kappa_1.html"
        },
        "0.7": {
          welton: "output/figures/gtfs_2026-01-04_2026-06-06/welton/trip_durations_kappa_0.7.html",
          dia: "output/figures/gtfs_2026-01-04_2026-06-06/dia/trip_durations_kappa_0.7.html"
        }
      }
    };

    const LABELS = {
      line: { D: "D Line", L: "L Line" },
      improvement: { "1": "No Track Improvement", "0.7": "With Track Improvement" }
    };

    const state = {
      line: "D",
      improvement: "1"
    };

    const lineButtons = document.querySelectorAll("#lineButtons button");
    const improvementButtons = document.querySelectorAll("#improvementButtons button");
    const weltonFrame = document.getElementById("weltonFrame");
    const diaFrame = document.getElementById("diaFrame");
    const weltonTitle = document.getElementById("weltonTitle");
    const diaTitle = document.getElementById("diaTitle");

    function setIframeHeight(iframe) {
      try {
        const doc = iframe.contentWindow.document;
        const body = doc.body;
        const html = doc.documentElement;

        const height = Math.max(
          body.scrollHeight,
          body.offsetHeight,
          html.clientHeight,
          html.scrollHeight,
          html.offsetHeight
        );

        iframe.style.height = height + "px";
      } catch (err) {
        console.warn("Could not resize iframe:", err);
      }
    }

    function watchIframe(iframe) {
      const resize = () => {
        setIframeHeight(iframe);
      };

      iframe.addEventListener("load", () => {
        resize();

        try {
          const doc = iframe.contentWindow.document;

          if (doc && doc.body) {
            const observer = new ResizeObserver(() => resize());
            observer.observe(doc.body);

            const html = doc.documentElement;
            if (html) observer.observe(html);
          }
        } catch (err) {
          console.warn("ResizeObserver not attached:", err);
        }

        // Plotly and similar libraries may render after load.
        setTimeout(resize, 100);
        setTimeout(resize, 500);
        setTimeout(resize, 1000);
      });
    }

    function updateUI() {
      const selected = REPORTS[state.line][state.improvement];

      weltonFrame.src = selected.welton;
      diaFrame.src = selected.dia;

      weltonTitle.textContent =
        `${LABELS.line[state.line]} · ${LABELS.improvement[state.improvement]} · Welton`;

      diaTitle.textContent =
        `${LABELS.line[state.line]} · ${LABELS.improvement[state.improvement]} · DIA`;

      lineButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.line === state.line);
      });

      improvementButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.improvement === state.improvement);
      });
    }

    lineButtons.forEach(button => {
      button.addEventListener("click", () => {
        state.line = button.dataset.line;
        updateUI();
      });
    });

    improvementButtons.forEach(button => {
      button.addEventListener("click", () => {
        state.improvement = button.dataset.improvement;
        updateUI();
      });
    });

    watchIframe(weltonFrame);
    watchIframe(diaFrame);

    updateUI();
  </script>
</body>
</html>
