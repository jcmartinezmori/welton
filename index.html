<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Operational Scenarios under a Completed D Line</title>
  <style>
    body {
      margin: 0;
      background: #f6f7fb;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0;
      color: #6b7280;
    }

    .controls {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin: 20px 0;
      padding: 16px 20px;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
    }

    .control-label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #dbe2ea;
      background: white;
      color: #1f2937;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:hover {
      background: #f1f5f9;
    }

    button.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
      font-weight: bold;
    }

    .reports {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .report {
      width: 100%;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      overflow: hidden;
    }

    .report-title {
      margin: 0;
      padding: 10px 16px;
      font-size: 1.1rem;
      background: #fafafa;
      border-bottom: 1px solid #dbe2ea;
    }

    .figure-area {
      padding: 16px;
      min-height: 280px;
    }

    .figure-note {
      margin: 0 0 12px;
      color: #6b7280;
      font-size: 0.95rem;
    }

    .chart-box {
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 16px;
      min-height: 200px;
      background: #fff;
    }

    @media (max-width: 900px) {
      .page {
        padding: 10px;
      }

      .controls {
        gap: 15px;
      }
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Operational Scenarios under a Completed D Line</h1>
      <p class="subtitle"></p>
    </header>

    <div class="controls">
      <div>
        <span class="control-label">Line</span>
        <div class="button-row" id="lineButtons">
          <button type="button" class="active" data-line="D">Holiday Train (Original D Line)</button>
          <button type="button" data-line="L">L Line (Truncated D Line)</button>
        </div>
      </div>

      <div>
        <span class="control-label">Track assumption</span>
        <div class="button-row" id="improvementButtons">
          <button type="button" class="active" data-improvement="1">No Further Track Improvement</button>
          <button type="button" data-improvement="0.7">Reduction of In-Vehicle Travel Time</button>
        </div>
      </div>
    </div>

    <div class="reports">
      <div class="report">
        <h2 class="report-title">Access to Five Points</h2>
        <div class="figure-area">
          <p class="figure-note" id="weltonState"></p>
          <div class="chart-box" id="weltonChart"></div>
        </div>
      </div>

      <div class="report">
        <h2 class="report-title">Access to DIA</h2>
        <div class="figure-area">
          <p class="figure-note" id="diaState"></p>
          <div class="chart-box" id="diaChart"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentLine = "D";
    let currentImprovement = 1;

    const lineButtons = document.getElementById("lineButtons");
    const improvementButtons = document.getElementById("improvementButtons");

    const weltonState = document.getElementById("weltonState");
    const diaState = document.getElementById("diaState");
    const weltonChart = document.getElementById("weltonChart");
    const diaChart = document.getElementById("diaChart");

    function syncButtonStates() {
      document.querySelectorAll("#lineButtons button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.line === currentLine);
      });

      document.querySelectorAll("#improvementButtons button").forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.improvement) === currentImprovement);
      });
    }

    function renderWelton(line, improvement) {
      // Replace this with your actual Welton / Access to Five Points chart code.
      weltonState.textContent = `Line: ${line === "D" ? "Holiday Train (Original D Line)" : "L Line (Truncated D Line)"} | Track assumption: ${improvement === 1 ? "No Further Track Improvement" : "Reduction of In-Vehicle Travel Time"}`;

      weltonChart.innerHTML = `
        <strong>Access to Five Points</strong><br>
        This is where your first figure should render.<br>
        Current line: ${line}<br>
        Current improvement: ${improvement}
      `;
    }

    function renderDia(line, improvement) {
      // Replace this with your actual DIA / Access to DIA chart code.
      diaState.textContent = `Line: ${line === "D" ? "Holiday Train (Original D Line)" : "L Line (Truncated D Line)"} | Track assumption: ${improvement === 1 ? "No Further Track Improvement" : "Reduction of In-Vehicle Travel Time"}`;

      diaChart.innerHTML = `
        <strong>Access to DIA</strong><br>
        This is where your second figure should render.<br>
        Current line: ${line}<br>
        Current improvement: ${improvement}
      `;
    }

    function updateReports() {
      // Shared state: both figures always use the same line/improvement.
      renderWelton(currentLine, currentImprovement);
      renderDia(currentLine, currentImprovement);
      syncButtonStates();
    }

    lineButtons.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-line]");
      if (!btn) return;
      currentLine = btn.dataset.line;
      updateReports();
    });

    improvementButtons.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-improvement]");
      if (!btn) return;
      currentImprovement = Number(btn.dataset.improvement);
      updateReports();
    });

    updateReports();
  </script>
</body>
</html>
